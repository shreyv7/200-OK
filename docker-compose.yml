services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis
      POSTGRES_DB: trellis
    ports:
      - "5432:5432"
    volumes:
      - trellis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trellis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/trellisgraph
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - trellis_neo4j_data:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p trellisgraph 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file:
      - ./services/api/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://trellis:trellis@postgres:5432/trellis
      REDIS_URL: redis://redis:6379/0
      ENV: local
      AUTH_BYPASS: "true"
    ports:
      - "8000:8000"
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./services/api
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - ./services/api/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://trellis:trellis@postgres:5432/trellis
      REDIS_URL: redis://redis:6379/0
      ENV: local
      AUTH_BYPASS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  trellis_postgres_data:
  trellis_neo4j_data:
