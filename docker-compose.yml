services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis
      POSTGRES_DB: trellis
    ports:
      - "5432:5432"
    volumes:
      - trellis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trellis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
    env_file:
      - ./services/api/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://trellis:trellis@postgres:5432/trellis
      REDIS_URL: redis://redis:6379/0
      ENV: local
      AUTH_BYPASS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  trellis_postgres_data:
